# Builds the Windows installer and attaches it to a GitHub release.
# Runs when a release is published, or by hand from the Actions tab (give it the tag).
# The handwriting model isn't bundled: inkd downloads it on first launch.
name: Build release installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the installer to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Fetch DirectML.dll
        shell: bash
        run: bash scripts/fetch-redist.sh

      # ort-sys copies DirectML.dll into these folders during the build and
      # crashes if they don't exist yet, which they don't on a fresh runner.
      - name: Prepare build folders
        shell: bash
        run: mkdir -p src-tauri/target/release/{examples,deps} src-tauri/target/release/build/{examples,deps}

      - name: Build installer
        run: npm run tauri build

      - name: Attach to release
        shell: bash
        run: |
          installer=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n1)
          gh release upload "$TAG" "$installer" --clobber --repo "$GITHUB_REPOSITORY"
