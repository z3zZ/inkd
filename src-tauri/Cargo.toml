[package]
name = "inkd"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Handwriting maths for pen tablets. Your answers, inked."
default-run = "inkd"

[lib]
name = "inkd_lib"
path = "src/lib.rs"

[[bin]]
name = "inkd"
path = "src/main.rs"

# Model measurements from step zero. Kept out of release builds and the installer:
# cargo run --release --features dev-tools --bin step_zero
[[bin]]
name = "step_zero"
path = "src/bin/step_zero.rs"
required-features = ["dev-tools"]

[features]
dev-tools = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ort = { version = "=2.0.0-rc.12", features = ["directml"] }
ureq = "2"
sha2 = "0.10"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

# ONNX inference is unusably slow unoptimised, even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
