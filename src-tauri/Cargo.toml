[package]
name = "inkd"
version = "0.1.0"
edition = "2021"
default-run = "inkd"

[lib]
name = "inkd_lib"
path = "src/lib.rs"

[[bin]]
name = "inkd"
path = "src/main.rs"

[[bin]]
name = "step_zero"
path = "src/bin/step_zero.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ort = { version = "=2.0.0-rc.12", features = ["directml"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

# ONNX inference is unusably slow unoptimised, even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
